version: 0.0
os: linux

files:
  - source: /
    destination: /home/ec2-user/app

hooks:
  BeforeInstall:
    - location: scripts/cleanup.sh
      timeout: 20

  ApplicationStop:
    - location: scripts/stop.sh
      timeout: 20

  ApplicationStart:
    - location: scripts/start.sh
      timeout: 60

  ValidateService:
    - location: scripts/validate.sh
      timeout: 20